<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>
    <h1>Edit Product</h1>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}
    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ product.name }}" required><br><br>

        <label>Description:</label><br>
        <input type="text" name="description" value="{{ product.description }}" required><br><br>

        <label>Category:</label><br>
        <input type="text" name="category" value="{{ product.category }}" required><br><br>

        <label>Price:</label><br>
        <input type="text" name="price" value="{{ product.price }}" required><br><br>

        <label>Stock Quantity:</label><br>
        <input type="number" name="stock" value="{{ product.stock }}" required><br><br>

        <label>Image URL:</label><br>
        <input type="text" name="image_url" value="{{ product.image_url }}"><br><br>

        <button type="submit">Save Changes</button>
        <a href="/product/{{ product.product_id }}">Cancel</a>
    </form>
</body>
</html>
