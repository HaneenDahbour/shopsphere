<!DOCTYPE html>
<html>
<head>
    <title>ShopSphere</title>
</head>
<body>
    <h1>ShopSphere - Product Catalog</h1>
    <a href="/add">+ Add New Product</a>
    <hr>
    {% for product in products %}
        <div>
            <h3>{{ product.name }}</h3>
            <p>Category: {{ product.category }}</p>
            <p>Price: ${{ product.price }}</p>
            <a href="/product/{{ product.product_id }}">View Details</a>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
